# ป้องกันปัญหา Warning เรื่อง FQDN (Could not reliably determine...)
ServerName localhost:80

# กำหนด Timeout และ KeepAlive เพื่อความเสถียรของ Connection
Timeout 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# ค่ามาตรฐานสำหรับ MPM Prefork (เหมาะกับ PHP แบบดั้งเดิมใน Apache 2.2)
<IfModule mpm_prefork_module>
    StartServers          5
    MinSpareServers       5
    MaxSpareServers      10
    MaxClients          150
    MaxRequestsPerChild   1000
</IfModule>

# ลำดับไฟล์หน้าแรกเริ่มต้น
DirectoryIndex nindex.htm index.php index.html index.htm cgi-bin

# ปิดการแสดงเวอร์ชัน Apache และ OS เพื่อความปลอดภัย (Security)
ServerSignature Off
ServerTokens Prod

# กำหนดสิทธิ์เข้าถึงเบื้องต้นสำหรับ Root Directory
<Directory />
    Options FollowSymLinks
    AllowOverride None
    Order deny,allow
    Deny from all
</Directory>