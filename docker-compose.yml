services:
    webold:
        container_name: "php52"
        build:
            context: ./php52
        ports:
            - "80:80"
        depends_on:
          - db
        volumes:
            - "/mnt/d/docker/www:/usr/local/apache2/htdocs/"
            # - /var/www/html:/usr/local/apache2/htdocs/
        networks:
            - dev-network
    web:
        container_name: "php53"
        build:
            context: ./php53
        ports:
            - "8053:80"
        depends_on:
          - db
        volumes:
            - "/mnt/d/docker/www:/usr/local/apache2/htdocs/"
            # - /var/www/html:/usr/local/apache2/htdocs/
        networks:
            - dev-network
    web2:
        container_name: "php8512"
        build:
            context: ./php8512
        ports:
            - "8080:80"
            - "443:443"
        depends_on:
            - db
        volumes:
            - "/mnt/d/docker/www:/var/www/html/"
            # - /var/www/html:/var/www/html/
        networks:
            - dev-network
    db:
        container_name: mysql5562
        image: mysql:5.5.62
        ports: 
            - "3308:3306"
        # command: [--default-authentication-plugin=mysql_native_password]
        environment:
            MYSQL_ROOT_PASSWORD: example
            # MYSQL_ROOT_PASSWORD: 12345678
            # MYSQL_DATABASE: smdb
            # MYSQL_USER: mydbuser
            # MYSQL_PASSWORD: 12345678
        restart: always
        volumes:
            - /mnt/d/docker/mysql:/var/lib/mysql/
            # - /var/lib/mysql/:/var/lib/mysql
        networks:
            - dev-network
volumes:
    mysql_data:
networks:
  dev-network:
    driver: bridge